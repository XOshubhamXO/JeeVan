# JeeVan Platform — Gitleaks Configuration
# Detects secrets and credentials in codebase

title: JeeVan Gitleaks Config

[allowlist]
  description = "JeeVan allowed patterns"
  paths = [
    ".env.example",
    "JEEVAN_DOCS.md",
    "android/google-play-listing.md",
    "ios/app-store-listing.md",
  ]

[[rules]]
  id = "AWS_ACCESS_KEY"
  description = "AWS Access Key"
  regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''

[[rules]]
  id = "GCP_API_KEY"
  description = "Google Cloud API Key"
  regex = '''AIza[0-9A-Za-z\-_]{35}'''

[[rules]]
  id = "PRIVATE_KEY"
  description = "Private Key (PEM)"
  regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''

[[rules]]
  id = "JWT_TOKEN"
  description = "JWT Token"
  regex = '''eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9]{10,}\.[a-zA-Z0-9\-_]{10,}'''

[[rules]]
  id = "SUPABASE_KEY"
  description = "Supabase Service Role Key"
  regex = '''eyJ[a-zA-Z0-9\-_]{50,}'''

[[rules]]
  id = "GROQ_KEY"
  description = "Groq API Key"
  regex = '''gsk_[a-zA-Z0-9]{20,}'''

[[rules]]
  id = "GEMINI_KEY"
  description = "Google Gemini API Key"
  regex = '''AIza[0-9A-Za-z\-_]{35}'''

[[rules]]
  id = "PASSWORD_IN_CODE"
  description = "Hardcoded password"
  regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['"][^'"]+['"]'''
  allowlist = {
    paths = [".env.example", ".github/", "tests/"]
  }
